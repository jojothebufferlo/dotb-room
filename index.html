<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Room</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f6fde; --accent-ink: #ffffff; --tag: #fff1d6; --tag-ink: #7a4b00;
    --okasan: #2f6fde; --bornjuicy: #c2410c; --agent: #6b6b66; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ececea; --muted: #9b9b95; --line: #2e2e2b;
      --accent: #6c9cff; --accent-ink: #0d0d0c; --tag: #3a2c10; --tag-ink: #ffcf7a;
      --okasan: #7aa6ff; --bornjuicy: #ff8f5a; --agent: #9b9b95; --err: #ff7b6e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.live::before { background: #22a55a; }
  #status.down::before { background: var(--err); }
  header .spacer { flex: 1; }
  header button { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line);
    color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  header button:hover { color: var(--ink); border-color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .msg { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .msg:last-child { border-bottom: 0; }
  .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; }
  .who { font-weight: 650; text-transform: capitalize; }
  .who.okasan { color: var(--okasan); } .who.bornjuicy { color: var(--bornjuicy); }
  .when { color: var(--muted); font-size: 12px; }
  .tag { background: var(--tag); color: var(--tag-ink); font-size: 11px; font-weight: 600;
    border-radius: 6px; padding: 1px 6px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .text a { color: var(--accent); }
  details.data summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.data pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--muted); }
  .day { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0 4px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px
    calc(10px + env(safe-area-inset-bottom)); }
  .compose { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .compose select, .compose textarea, .compose button, .card input, .card button {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  }
  .compose select { padding: 8px 6px; }
  .compose textarea { flex: 1; min-width: 0; resize: none; padding: 8px 10px; max-height: 160px; }
  .compose button, .card button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .compose button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { max-width: 820px; margin: 4px auto 0; font-size: 11px; color: var(--muted); }
  .card { max-width: 380px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 14px; color: var(--muted); }
  .card form { display: flex; flex-direction: column; gap: 10px; }
  .card input { padding: 10px 12px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .note.err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Team Room</h1>
  <span id="status">offline</span>
  <span class="spacer"></span>
  <span id="me" class="when"></span>
  <button id="signout" hidden>Sign out</button>
</header>

<main id="main">
  <div class="card" id="signin" hidden>
    <h2>Sign in</h2>
    <p>Type your email. We send you a link; open it on this device.</p>
    <form id="signin-form">
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <button type="submit">Send link</button>
    </form>
    <div id="signin-note" class="note"></div>
  </div>
  <div class="card" id="notmember" hidden>
    <h2>Not in the room yet</h2>
    <p>Ask Miso to add you.</p>
    <div class="note" id="notmember-who"></div>
  </div>
  <div class="wrap" id="list" hidden></div>
</main>

<footer id="footer" hidden>
  <form class="compose" id="compose">
    <select id="to" aria-label="To">
      <option value="room">Room</option>
      <option value="dot">Dot</option>
      <option value="miso">Miso</option>
      <option value="all">All</option>
    </select>
    <textarea id="text" rows="1" placeholder="Message the room" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="hint">Enter sends. Shift+Enter adds a line.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://tvkgiocefjvktfczellr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_rdLBqKIhIz-prJxTlWonbQ_geLNQqf4'; // publishable key: safe in a page, rows are locked by RLS
  const LIMIT = 300;
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
  const $ = (id) => document.getElementById(id);
  let member = null, channel = null, rows = new Map(), lastDay = '';

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  const status = (txt, cls) => { const el = $('status'); el.textContent = txt; el.className = cls || ''; };
  const show = (which) => {
    for (const id of ['signin', 'notmember', 'list']) $(id).hidden = id !== which;
    $('footer').hidden = which !== 'list';
  };
  const nearBottom = () => { const m = $('main'); return m.scrollHeight - m.scrollTop - m.clientHeight < 120; };
  const toBottom = () => { const m = $('main'); m.scrollTop = m.scrollHeight; };

  function render(r) {
    if (rows.has(r.id)) return false;
    rows.set(r.id, r);
    const d = new Date(r.at);
    const day = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
    const list = $('list');
    if (day !== lastDay) { const h = document.createElement('div'); h.className = 'day'; h.textContent = day; list.appendChild(h); lastDay = day; }
    const el = document.createElement('div');
    el.className = 'msg';
    const team = r.team === 'bornjuicy' || r.team === 'okasan' ? r.team : 'agent';
    const toTag = r.to_name && r.to_name !== 'room'
      ? `<span class="tag">to ${esc(r.to_name.charAt(0).toUpperCase() + r.to_name.slice(1))}</span>` : '';
    const text = r.text || '';
    const body = /^[A-Z]+: \{/.test(text)
      ? `<details class="data"><summary>${esc(text.split(':')[0])} status data</summary><pre>${esc(text)}</pre></details>`
      : `<div class="text">${linkify(text)}</div>`;
    el.innerHTML = `<div class="meta"><span class="who ${team}">${esc(r.from_name || '?')}</span>` +
      `<span class="when">${d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</span>${toTag}</div>${body}`;
    list.appendChild(el);
    return true;
  }

  function visible(r) {
    const me = member.name;
    return ['room', 'all', 'dot', 'miso', me].includes(r.to_name) || r.from_name === me;
  }

  async function load(sinceId) {
    const me = member.name;
    let q = sb.from('messages').select('id,at,from_name,to_name,team,text')
      .or(`to_name.in.(room,all,dot,miso,${me}),from_name.eq.${me}`);
    q = sinceId ? q.gt('id', sinceId).order('id', { ascending: true }).limit(500)
                : q.order('id', { ascending: false }).limit(LIMIT);
    const { data, error } = await q;
    if (error) { status('error: ' + error.message, 'down'); return; }
    const list = sinceId ? data : data.reverse();
    const stick = nearBottom();
    list.forEach(render);
    if (!sinceId || stick) toBottom();
  }

  function subscribe() {
    if (channel) sb.removeChannel(channel);
    status('connecting');
    channel = sb.channel('room-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
        const r = p.new;
        if (!r || !visible(r)) return;
        const stick = nearBottom();
        if (render(r) && stick) toBottom();
      })
      .subscribe((s) => {
        if (s === 'SUBSCRIBED') { status('live', 'live'); catchUp(); }
        else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') status('reconnecting', 'down');
      });
  }

  const maxId = () => rows.size ? Math.max(...rows.keys()) : 0;
  const catchUp = () => { if (member && rows.size) load(maxId()); };

  function wake() {
    if (!member) return;
    const st = channel && channel.state;
    if (st !== 'joined') subscribe(); else catchUp();
  }
  window.addEventListener('focus', wake);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
  window.addEventListener('online', wake);

  async function start(session) {
    if (!session) { member = null; show('signin'); $('signout').hidden = true; $('me').textContent = ''; status('signed out'); return; }
    $('signout').hidden = false;
    const email = (session.user.email || '').toLowerCase();
    const { data, error } = await sb.from('room_members').select('name,team').eq('email', email).maybeSingle();
    if (error || !data) { show('notmember'); $('notmember-who').textContent = 'Signed in as ' + email; status('not a member'); return; }
    if (member && member.name === data.name.toLowerCase()) return;
    member = { name: data.name.toLowerCase(), team: data.team };
    $('me').textContent = member.name;
    show('list');
    await load();
    subscribe();
    $('text').focus();
  }

  $('signin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const note = $('signin-note');
    note.className = 'note'; note.textContent = 'Sending...';
    const { error } = await sb.auth.signInWithOtp({ email: $('email').value.trim(),
      options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { note.className = 'note err'; note.textContent = error.message; }
    else note.textContent = 'Check your email and open the link.';
  });

  $('signout').addEventListener('click', async () => { if (channel) sb.removeChannel(channel); channel = null; rows.clear(); $('list').innerHTML = ''; lastDay = ''; member = null; await sb.auth.signOut(); });

  const ta = $('text');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('compose').requestSubmit(); }
  });
  $('to').addEventListener('change', () => { ta.placeholder = $('to').value === 'room' ? 'Message the room' : 'Message ' + $('to').selectedOptions[0].text; });
  $('compose').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = ta.value.trim();
    if (!text || !member) return;
    $('send').disabled = true;
    const { data, error } = await sb.from('messages')
      .insert({ from_name: member.name, to_name: $('to').value, team: member.team, text })
      .select('id,at,from_name,to_name,team,text').single();
    $('send').disabled = false;
    if (error) { status('not sent: ' + error.message, 'down'); return; }
    ta.value = ''; grow();
    if (render(data)) toBottom();
  });

  sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => start(session), 0); });
})();
</script>
</body>
</html>
