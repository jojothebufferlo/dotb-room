<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Team Room</title>
<meta name="theme-color" content="#07060d">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Room">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="lr-core.css?v=202611241106">
<link rel="stylesheet" href="hq.css?v=202611241106">
<link rel="stylesheet" href="room.css?v=202611241106">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="grid"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- the door: sign in, or ask to join -->
<div class="gate" id="gate">
  <div class="gatein">
    <div class="glogo" aria-hidden="true"><span></span><span></span><span></span><b></b></div>
    <p class="gkick" id="gKick">One team. One room.</p>
    <h1 class="gtitle" id="gTitle">Team Room</h1>
    <div class="gbox panel" id="gCard" aria-live="polite"><div class="gspin" aria-label="Opening the room"><i></i><i></i><i></i></div></div>
    <p class="gfoot" id="gFoot"></p>
  </div>
</div>

<div class="hq" id="hq" hidden>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i></span>
      <h1 id="brandName">Team <span>Room</span></h1>
    </div>
    <span class="conn wait" id="conn" role="status" aria-live="polite"><i></i><span id="connText">Reading</span></span>
    <button type="button" class="me" id="meBtn" data-tab="people" aria-label="You and the team"><span id="meIni">?</span></button>
  </header>

  <main id="main">
    <div id="notice" class="sec" hidden></div>

    <section class="view" id="v-today" data-view="today" aria-labelledby="h-today">
      <div class="vhead"><span class="eyebrow" id="todayDate">Today</span><h2 id="h-today">Today</h2></div>
      <div id="todayBody"><div class="skel" aria-hidden="true"><i></i><i></i><i></i></div></div>
    </section>

    <section class="view" id="v-approve" data-view="approve" aria-labelledby="h-approve" hidden>
      <div class="vhead"><h2 id="h-approve">Needs you</h2></div>
      <div id="approveBody"><div class="skel" aria-hidden="true"><i></i><i></i><i></i></div></div>
    </section>

    <section class="view chatview" id="v-chat" data-view="chat" aria-labelledby="h-chat" hidden>
      <div class="vhead chead"><h2 id="h-chat">Chat</h2>
        <div class="seg" role="group" aria-label="Which messages">
          <button type="button" class="segb" data-chat-filter="room" aria-pressed="true">Room</button>
          <button type="button" class="segb" data-chat-filter="me" aria-pressed="false">To me</button>
          <button type="button" class="segb" data-chat-filter="bus" aria-pressed="false" id="busBtn" hidden>All traffic</button>
        </div>
      </div>
      <div id="chatBody" class="chatlist" role="log" aria-live="polite"><div class="skel" aria-hidden="true"><i></i><i></i><i></i></div></div>
      <button type="button" class="newpill" id="chatNew" hidden>New messages</button>
      <form class="composer" id="composer" autocomplete="off">
        <div class="tochips" id="toChips" role="radiogroup" aria-label="Send to"></div>
        <div class="crow">
          <textarea id="chatText" rows="1" placeholder="Message the room" aria-label="Your message" maxlength="4000"></textarea>
          <button type="submit" class="btn primary sendb" id="chatSend" aria-label="Send" disabled></button>
        </div>
      </form>
    </section>

    <section class="view" id="v-launches" data-view="launches" aria-labelledby="h-launches" hidden>
      <div class="vhead"><h2 id="h-launches">Launches</h2></div>
      <div class="lrwrap" id="lrBody"></div>
    </section>

    <section class="view" id="v-team" data-view="team" aria-labelledby="h-team" hidden>
      <div class="vhead"><h2 id="h-team">Team</h2></div>
      <div id="teamBody"><div class="skel" aria-hidden="true"><i></i><i></i></div></div>
    </section>

    <section class="view" id="v-menu" data-view="menu" aria-labelledby="h-menu" hidden>
      <div class="vhead"><h2 id="h-menu">Numbers</h2></div>
      <div id="menuBody"><div class="skel" aria-hidden="true"><i></i><i></i></div></div>
    </section>

    <section class="view" id="v-people" data-view="people" aria-labelledby="h-people" hidden>
      <div class="vhead"><h2 id="h-people">People</h2></div>
      <div id="peopleBody"><div class="skel" aria-hidden="true"><i></i><i></i></div></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><p id="toastText"></p><button type="button" class="btn" id="toastUndo">Undo</button></div>

<nav class="tabs" id="tabs" aria-label="Sections" hidden>
  <div class="sub" id="subtabs" role="tablist" aria-label="More sections" hidden>
    <button type="button" class="tab" role="tab" id="t-team" data-tab="team" aria-controls="v-team" aria-selected="false"><span class="ico" data-i="team"></span>Team</button>
    <button type="button" class="tab" role="tab" id="t-menu" data-tab="menu" aria-controls="v-menu" aria-selected="false"><span class="ico" data-i="chart"></span>Numbers</button>
    <button type="button" class="tab" role="tab" id="t-people" data-tab="people" aria-controls="v-people" aria-selected="false"><span class="ico" data-i="people"></span>People</button>
  </div>
  <div class="in" role="tablist">
    <i class="ink" id="tabInk" aria-hidden="true"></i>
    <button type="button" class="tab" role="tab" id="t-today" data-tab="today" aria-controls="v-today" aria-selected="true"><span class="ico" data-i="today"></span>Today</button>
    <button type="button" class="tab" role="tab" id="t-approve" data-tab="approve" aria-controls="v-approve" aria-selected="false"><span class="ico" data-i="approve"></span>Needs you<span class="badge" id="badge" hidden></span></button>
    <button type="button" class="tab" role="tab" id="t-chat" data-tab="chat" aria-controls="v-chat" aria-selected="false"><span class="ico" data-i="reply"></span>Chat<span class="badge" id="chatBadge" hidden></span></button>
    <button type="button" class="tab" role="tab" id="t-launches" data-tab="launches" aria-controls="v-launches" aria-selected="false"><span class="ico" data-i="launches"></span>Launches</button>
    <button type="button" class="tab more" id="t-more" data-more aria-expanded="false" aria-controls="subtabs"><span class="ico" data-i="menu"></span>More</button>
  </div>
</nav>

<script src="config.js?v=202611241106"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="lr-core.js?v=202611241106"></script>
<script src="hq-core.js?v=202611241106"></script>
<script src="room.js?v=202611241106"></script>
</body>
</html>
